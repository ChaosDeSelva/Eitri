[package]
name = "eitri"
version = "0.1.0"
description = "Bring-your-own-key studio for planning, generating and reviewing batches of AI images"
authors = ["Eitri contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.80"

[lib]
name = "eitri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
tauri = { version = "2.10.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.4"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
webp = "0.3"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
