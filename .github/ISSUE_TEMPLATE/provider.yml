name: Provider report
description: A provider or model fails, or behaves differently from its docs.
labels: [provider]
body:
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [OpenAI, Google Gemini, fal.ai, Replicate, Stability AI, OpenAI-compatible]
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model id
      placeholder: fal-ai/flux-pro/kontext
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error shown
      description: From the Run list, Review panel or Activity tab. It starts with [provider model].
      render: text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What you were doing
      description: Draw, redo with a note, preview with style references, planning...
  - type: checkboxes
    id: works
    attributes:
      label: Does the model work outside Eitri?
      options:
        - label: The same model and prompt work in the provider's own playground or API.
